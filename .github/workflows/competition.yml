name: Competition

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID to process'
        required: true
        type: string
  workflow_run:
    workflows: ['Validation']
    types:
      - completed

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: competition-${{ github.run_id }}
  cancel-in-progress: false

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

jobs:
  competition:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Determine Run ID
        id: run-id
        run: |
          if [ -n "${{ inputs.run_id }}" ]; then
            echo "RUN_ID=${{ inputs.run_id }}" >> $GITHUB_OUTPUT
          else
            LATEST=$(ls -t research/runs/RUN-*.json 2>/dev/null | head -1)
            if [ -n "$LATEST" ]; then
              RUN_ID=$(basename "$LATEST" .json)
              echo "RUN_ID=$RUN_ID" >> $GITHUB_OUTPUT
            else
              echo "No run manifests found"
              exit 1
            fi
          fi

      - name: Run Competition Research
        run: |
          npx tsx src/cli/stage-competition.ts "${{ steps.run-id.outputs.RUN_ID }}"

      - name: Commit and Push Results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add opportunities/ research/
          git diff --staged --quiet || git commit -m "[${{ steps.run-id.outputs.RUN_ID }}] Competition results"
          git push
