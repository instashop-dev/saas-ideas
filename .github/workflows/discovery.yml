name: Discovery

on:
  workflow_dispatch:
    inputs:
      trigger:
        description: 'Trigger type'
        type: choice
        default: 'manual'
        options:
          - manual
          - scheduled
          - retry
      keyword:
        description: 'Keyword to focus research on (optional)'
        required: false
        type: string
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: discovery-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_id: ${{ steps.create-run.outputs.RUN_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Create Discovery Run
        id: create-run
        run: |
          TRIGGER="${{ inputs.trigger || 'scheduled' }}"
          KEYWORD="${{ inputs.keyword || '' }}"
          OUTPUT=$(npx tsx src/cli/discovery.ts "$TRIGGER" "$KEYWORD")
          echo "$OUTPUT"

          RUN_ID=$(echo "$OUTPUT" | grep 'RUN_ID=' | cut -d'=' -f2)
          echo "RUN_ID=$RUN_ID" >> $GITHUB_OUTPUT
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: Commit run manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/runs/
          git diff --staged --quiet || git commit -m "Create run manifest $RUN_ID"
          git push

      - name: Summary
        run: |
          echo "## Discovery Run Created" >> $GITHUB_STEP_SUMMARY
          echo "**Run ID**: $RUN_ID" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger**: ${{ inputs.trigger || 'scheduled' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Keyword**: ${{ inputs.keyword || '(none — broad discovery)' }}" >> $GITHUB_STEP_SUMMARY
