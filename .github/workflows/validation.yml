name: Validation

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID to process'
        required: true
        type: string
  workflow_run:
    workflows: ['Clustering']
    types:
      - completed

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: validation-${{ github.run_id }}
  cancel-in-progress: false

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

jobs:
  validation:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Determine Run ID
        id: run-id
        run: |
          if [ -n "${{ inputs.run_id }}" ]; then
            echo "RUN_ID=${{ inputs.run_id }}" >> $GITHUB_OUTPUT
          else
            # Prefer the run id from the most recent commit that touched
            # research/runs: ls -t is not reliable on fresh checkouts because
            # all checked-out files share the same mtime (arbitrary order),
            # which caused chained stages to reprocess stale runs.
            RUN_ID=$(git show --name-only --format="" HEAD 2>/dev/null | grep -oE 'RUN-[A-F0-9]{8}\.json' | head -1 | sed 's/\.json$//')
            if [ -z "$RUN_ID" ]; then
              LATEST=$(ls -t research/runs/RUN-*.json 2>/dev/null | head -1)
              [ -n "$LATEST" ] && RUN_ID=$(basename "$LATEST" .json)
            fi
            if [ -n "$RUN_ID" ]; then
              echo "RUN_ID=$RUN_ID" >> $GITHUB_OUTPUT
            else
              echo "No run manifests found"
              exit 1
            fi
          fi

      - name: Run Validation
        run: |
          npx tsx src/cli/stage-validate.ts "${{ steps.run-id.outputs.RUN_ID }}"

      - name: Commit and Push Results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/ opportunities/
          git diff --staged --quiet || git commit -m "[${{ steps.run-id.outputs.RUN_ID }}] Validation results"
          git push
