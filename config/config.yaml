models:
  # Pain mining / web research → Kimi K3
  pain_miner:
    primary: "moonshotai/kimi-k3"
    fallbacks:
      - "deepseek/deepseek-v4-flash"
      - "qwen/qwen3.7-flash"

  # Clustering → Kimi K3
  clusterer:
    primary: "moonshotai/kimi-k3"
    fallbacks:
      - "deepseek/deepseek-v4-pro"
      - "deepseek/deepseek-v4-flash"

  # Pain validation → Kimi K3, fallback DeepSeek V4 Pro
  validator:
    primary: "moonshotai/kimi-k3"
    fallbacks:
      - "deepseek/deepseek-v4-pro"
      - "z-ai/glm-5.2"

  # Competition research → Kimi K3
  competition:
    primary: "moonshotai/kimi-k3"
    fallbacks:
      - "deepseek/deepseek-v4-pro"
      - "deepseek/deepseek-v4-flash"

  # Debate: different models = useful diversity
  # Bull → Kimi K3
  bull:
    primary: "moonshotai/kimi-k3"
    fallbacks:
      - "deepseek/deepseek-v4-pro"

  # Bear → DeepSeek V4 Pro (adversarial perspective from a different model family)
  bear:
    primary: "deepseek/deepseek-v4-pro"
    fallbacks:
      - "moonshotai/kimi-k3"

  # Customer → GLM 5.2 (buyer perspective from a third model family)
  customer:
    primary: "z-ai/glm-5.2"
    fallbacks:
      - "moonshotai/kimi-k3"

  # Final judge → Kimi K3
  judge:
    primary: "moonshotai/kimi-k3"
    fallbacks:
      - "deepseek/deepseek-v4-pro"

research:
  ecosystems:
    - github-issues
    - reddit
    - stack-exchange
    - indie-hackers
    - hacker-news
    - product-hunt-reviews
    - upwork-job-postings
    - g2-capterra-reviews
    - dev-to
    - discord-forums
  max_signals_per_worker: 30
  max_clusters_per_run: 50
  max_candidates_after_validation: 20
  max_candidates_after_competition: 10
  max_finalists: 10

parallelism:
  pain_miners: 4
  validators: 5
  competition: 5
  debate: 9

gates:
  min_independent_sources: 3
  min_pain_score: 4
  min_frequency_score: 3
  min_wtp_score: 3
  min_global_score: 4
  max_competition_score: 2
  min_evidence_quality: 3

llm:
  temperature: 0.2
  timeout_seconds: 180
  max_retries: 3

budget:
  max_cost_per_run_usd: null

schedule:
  enabled: true
  cron: "0 0 * * 0"
