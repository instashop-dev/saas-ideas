models:
  # Pain mining / web research → DeepSeek V4 Flash (fast + reliable)
  pain_miner:
    primary: 'deepseek/deepseek-v4-flash'
    fallbacks:
      - 'moonshotai/kimi-k3'
      - 'qwen/qwen3.7-flash'

  # Research planner → keyword → source + per-source question selection
  research_planner:
    primary: 'deepseek/deepseek-v4-flash'
    fallbacks:
      - 'moonshotai/kimi-k3'

  # Clustering
  clusterer:
    primary: 'deepseek/deepseek-v4-flash'
    fallbacks:
      - 'moonshotai/kimi-k3'
      - 'deepseek/deepseek-v4-pro'

  # Pain validation
  validator:
    primary: 'deepseek/deepseek-v4-flash'
    fallbacks:
      - 'moonshotai/kimi-k3'
      - 'deepseek/deepseek-v4-pro'
      - 'z-ai/glm-5.2'

  # Competition research
  competition:
    primary: 'deepseek/deepseek-v4-flash'
    fallbacks:
      - 'moonshotai/kimi-k3'
      - 'deepseek/deepseek-v4-pro'

  # Debate
  bull:
    primary: 'deepseek/deepseek-v4-flash'
    fallbacks:
      - 'moonshotai/kimi-k3'
      - 'deepseek/deepseek-v4-pro'

  bear:
    primary: 'deepseek/deepseek-v4-flash'
    fallbacks:
      - 'moonshotai/kimi-k3'
      - 'deepseek/deepseek-v4-pro'

  customer:
    primary: 'deepseek/deepseek-v4-flash'
    fallbacks:
      - 'z-ai/glm-5.2'
      - 'moonshotai/kimi-k3'

  # Final judge
  judge:
    primary: 'deepseek/deepseek-v4-flash'
    fallbacks:
      - 'moonshotai/kimi-k3'
      - 'deepseek/deepseek-v4-pro'

research:
  max_signals_per_worker: 30
  max_clusters_per_run: 50
  max_candidates_after_validation: 20
  max_candidates_after_competition: 10
  max_finalists: 10

parallelism:
  pain_miners: 4
  validators: 5
  competition: 5
  debate: 9

gates:
  min_independent_sources: 3
  min_pain_score: 4
  min_frequency_score: 3
  min_wtp_score: 3
  min_global_score: 4
  max_competition_score: 2
  min_evidence_quality: 3

llm:
  temperature: 0.2
  timeout_seconds: 120
  max_retries: 2
  max_tokens: 8192

budget:
  max_cost_per_run_usd: null

schedule:
  enabled: true
  cron: '0 0 * * 0'
